name: Deploy Platform

on:
  push:
    branches: [main]
    paths:
      - 'apps/platform/**'
      - 'packages/**'
      - 'migrations/**'
      - 'scripts/**'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v2
        with:
          version: 11.19.0

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Turso (libSQL): apply pending migrations from migrations/ directly over
      # the libSQL HTTP API. Applied files are tracked in schema_migrations so
      # re-runs skip them. The token is a scoped database credential — no open
      # network port is ever exposed.
      - name: Apply migrations to Turso
        env:
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
        run: node scripts/migrate.mjs

      - name: Build
        run: pnpm --filter platform build
        env:
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
          NUXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.CLERK_PUBLISHABLE_KEY }}
          NUXT_CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      # The Pages Worker reads these at RUNTIME (session middleware, Turso
      # client, Clerk verification). Build-time env alone is not enough —
      # sync them onto the project so every deployment inherits them.
      - name: Sync Pages project runtime env vars
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
          NUXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.CLERK_PUBLISHABLE_KEY }}
          NUXT_CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          DEMO_EMAIL: demo@churchos.my
        run: |
          PAYLOAD=$(node -e '
            const env = {}
            for (const [key, value] of Object.entries({
              TURSO_DATABASE_URL: process.env.TURSO_DATABASE_URL,
              TURSO_AUTH_TOKEN: process.env.TURSO_AUTH_TOKEN,
              NUXT_PUBLIC_CLERK_PUBLISHABLE_KEY: process.env.NUXT_PUBLIC_CLERK_PUBLISHABLE_KEY,
              NUXT_CLERK_SECRET_KEY: process.env.NUXT_CLERK_SECRET_KEY,
              JWT_SECRET: process.env.JWT_SECRET,
              DEMO_EMAIL: process.env.DEMO_EMAIL
            })) {
              env[key] = { type: "plain_text", value }
            }
            console.log(JSON.stringify({ env_vars: env }))
          ')
          # Purpose-built endpoint: updates ONLY the env bindings for each
          # environment (PATCH on the project would replace deployment_configs).
          for ENVIRONMENT in production preview; do
            HTTP=$(curl -sS -o /tmp/cf-env-$ENVIRONMENT.json -w "%{http_code}" \
              -X PATCH \
              "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/pages/projects/churchos-platform/environment/${ENVIRONMENT}" \
              -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
              -H "Content-Type: application/json" \
              -d "${PAYLOAD}")
            echo "${ENVIRONMENT}: Cloudflare API responded ${HTTP}"
            head -c 300 /tmp/cf-env-$ENVIRONMENT.json; echo
            [ "$HTTP" = "200" ] || { echo "Failed to sync ${ENVIRONMENT} env vars"; exit 1; }
          done

      # cloudflare/pages-action bundles wrangler v2, whose direct uploads
      # fail Cloudflare's deploy stage; deploy with current wrangler instead.
      - name: Deploy to Cloudflare Pages
        working-directory: apps/platform
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm dlx wrangler@4 pages deploy dist --project-name churchos-platform --branch main
