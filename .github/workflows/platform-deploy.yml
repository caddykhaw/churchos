name: Deploy Platform

on:
  push:
    branches: [main]
    paths:
      - 'apps/platform/**'
      - 'packages/**'
      - 'supabase/**'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v2
        with:
          version: 11.19.0

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Self-hosted Supabase: apply migrations straight to Postgres.
      # DATABASE_URL must point at the publicly reachable Postgres port
      # (e.g. postgres://postgres:<pass>@<host>:35432/postgres).
      # Applied files are tracked in schema_migrations so re-runs skip them
      # (the .sql files themselves are not idempotent).
      - name: Apply migrations to self-hosted Supabase
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          docker run --rm -i postgres:15.6 psql "$DATABASE_URL" -v ON_ERROR_STOP=1 <<'SQL'
          CREATE TABLE IF NOT EXISTS schema_migrations (
            filename TEXT PRIMARY KEY,
            applied_at TIMESTAMPTZ NOT NULL DEFAULT now()
          );
          SQL
          for migration in supabase/migrations/*.sql; do
            name=$(basename "$migration")
            applied=$(docker run --rm -i postgres:15.6 psql "$DATABASE_URL" -tAc \
              "SELECT 1 FROM schema_migrations WHERE filename = '$name'")
            if [ "$applied" = "1" ]; then
              echo "Skipping $name (already applied)"
              continue
            fi
            echo "Applying $name"
            docker run --rm -i postgres:15.6 psql "$DATABASE_URL" -v ON_ERROR_STOP=1 \
              < "$migration" || exit 1
            docker run --rm -i postgres:15.6 psql "$DATABASE_URL" \
              -c "INSERT INTO schema_migrations (filename) VALUES ('$name')" || exit 1
          done

      - name: Build
        run: pnpm --filter platform build
        env:
          NUXT_PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          NUXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          NUXT_SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/pages-action@v1
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          projectName: churchos-platform
          directory: apps/platform/.output/public
