name: Cleanup demo.churchos.my

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/cleanup-demo-domain.yml'

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Diagnose and remove demo.churchos.my
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
        run: |
          set -uo pipefail
          DOMAIN=demo.churchos.my
          API=https://api.cloudflare.com/client/v4
          AUTH="Authorization: Bearer $CLOUDFLARE_API_TOKEN"

          # --- 1. Detach from the two known Pages projects (raw output, non-fatal).
          for PROJECT in churchos-platform churchos-marketing; do
            STATUS=$(curl -s -o /tmp/dom.json -w '%{http_code}' -X DELETE \
              -H "$AUTH" \
              "$API/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects/$PROJECT/domains/$DOMAIN" || echo "curl-err")
            echo "Pages '$PROJECT' delete -> HTTP $STATUS: $(head -c 250 /tmp/dom.json 2>/dev/null)"
          done

          # --- 2. List ALL Pages projects raw (to see auth status and every domain).
          echo "=== Raw Pages projects list ==="
          curl -s -H "$AUTH" "$API/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects" | head -c 2500; echo

          # --- 3. Workers custom domains for the hostname (deleting removes its DNS too).
          echo "=== Workers domains raw ==="
          WD=$(curl -s -H "$AUTH" "$API/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/domains?hostname=$DOMAIN&per_page=50")
          echo "$WD" | head -c 800; echo
          for ID in $(echo "$WD" | jq -r '.result[]?.id // empty' 2>/dev/null); do
            DEL=$(curl -s -w '%{http_code}' -o /tmp/wdel.json -X DELETE \
              -H "$AUTH" \
              "$API/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/domains/$ID")
            echo "Workers domain $ID delete -> HTTP $DEL: $(head -c 250 /tmp/wdel.json)"
          done

          # --- 4. DNS records (token may lack Zone.DNS — report honestly).
          echo "=== DNS records raw ==="
          LIST=$(curl -s -H "$AUTH" "$API/zones/$CLOUDFLARE_ZONE_ID/dns_records?name=$DOMAIN&per_page=50")
          echo "$LIST" | head -c 800; echo
          for ID in $(echo "$LIST" | jq -r '.result[]?.id // empty' 2>/dev/null); do
            DEL=$(curl -s -w '%{http_code}' -o /tmp/del.json -X DELETE \
              -H "$AUTH" \
              "$API/zones/$CLOUDFLARE_ZONE_ID/dns_records/$ID")
            echo "Deleted DNS record $ID -> HTTP $DEL: $(head -c 250 /tmp/del.json)"
          done

          echo "Cleanup pass complete."
