name: Cleanup demo.churchos.my

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/cleanup-demo-domain.yml'

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Detach demo.churchos.my from Pages and delete DNS record
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
        run: |
          set -euo pipefail
          DOMAIN=demo.churchos.my
          API=https://api.cloudflare.com/client/v4

          # Remove the custom domain from the known Pages projects.
          for PROJECT in churchos-platform churchos-marketing; do
            STATUS=$(curl -s -o /tmp/dom.json -w '%{http_code}' -X DELETE \
              -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
              "$API/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects/$PROJECT/domains/$DOMAIN")
            echo "Pages '$PROJECT' delete -> HTTP $STATUS: $(cat /tmp/dom.json | head -c 200)"
          done

          # Delete the DNS record(s) for the domain in the zone.
          LIST=$(curl -s -w '\n%{http_code}' -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "$API/zones/$CLOUDFLARE_ZONE_ID/dns_records?name=$DOMAIN&per_page=50")
          CODE=$(echo "$LIST" | tail -1)
          BODY=$(echo "$LIST" | sed '$d')
          echo "DNS list -> HTTP $CODE: $(echo "$BODY" | head -c 300)"
          IDS=$(echo "$BODY" | jq -r '.result[].id // empty')
          for ID in $IDS; do
            DEL=$(curl -s -w '%{http_code}' -X DELETE -o /tmp/del.json \
              -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
              "$API/zones/$CLOUDFLARE_ZONE_ID/dns_records/$ID")
            echo "Deleted DNS record $ID -> HTTP $DEL: $(head -c 200 /tmp/del.json)"
          done

          echo "Cleanup complete."
