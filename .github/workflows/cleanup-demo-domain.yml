name: Cleanup demo.churchos.my

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/cleanup-demo-domain.yml'

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Detach demo.churchos.my from Pages and delete DNS record
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
        run: |
          set -euo pipefail
          DOMAIN=demo.churchos.my
          API=https://api.cloudflare.com/client/v4

          # Remove the custom domain from any Pages project that has it.
          for PROJECT in $(curl -sf -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "$API/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects?per_page=50" | jq -r '.result[].name'); do
            STATUS=$(curl -s -o /tmp/dom.json -w '%{http_code}' -X DELETE \
              -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
              "$API/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects/$PROJECT/domains/$DOMAIN")
            if [ "$STATUS" = "200" ]; then
              echo "Detached $DOMAIN from Pages project '$PROJECT'"
            else
              echo "Pages '$PROJECT': no-op (HTTP $STATUS)"
            fi
          done

          # Delete the DNS record(s) for the domain in the zone.
          IDS=$(curl -sf -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "$API/zones/$CLOUDFLARE_ZONE_ID/dns_records?name=$DOMAIN&per_page=50" | jq -r '.result[].id')
          if [ -z "$IDS" ]; then
            echo "No DNS records found for $DOMAIN (already clean)"
          fi
          for ID in $IDS; do
            curl -sf -X DELETE \
              -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
              "$API/zones/$CLOUDFLARE_ZONE_ID/dns_records/$ID" > /dev/null
            echo "Deleted DNS record $ID for $DOMAIN"
          done

          echo "Cleanup complete."
