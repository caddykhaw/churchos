# nginx.conf — ChurchOS local Supabase reverse proxy
# Listens on host port 8088 → forwards /rest/v1/ to the postgrest container (port 3000)
events {
    worker_connections 1024;
}

http {
    upstream postgrest {
        server rest:3000;
    }

    server {
        listen 80;
        server_name localhost;

        location /rest/v1/ {
            proxy_pass http://postgrest/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
    }
}
