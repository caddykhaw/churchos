# docker-compose.yml — ChurchOS local Supabase stack
# Plan: docs/superpowers/plans/2026-08-24-foundation-infrastructure.md §Task 2
#
# Port mapping (deviated from plan to avoid collisions with existing services on this host):
#   plan:  5432 / 3000 / 3001 / 80
#   used:  35432 / 38080 / 33001 / 8088
#
# Update NUXT_PUBLIC_SUPABASE_URL etc. in .env to match (e.g. http://localhost:38080)
services:
  db:
    image: supabase/postgres:15.6.1.146  # plan: 15.6.1.147 (gone from Docker Hub, last available)
    container_name: churchos-db
    restart: unless-stopped
    ports:
      - "35432:5432"
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: postgres
    volumes:
      - db-data:/var/lib/postgresql/data
    # Studio env uses POSTGRES_HOST=db / SUPABASE_URL=http://rest:3000 — those
    # hostnames are resolved via NETWORK ALIASES, not container names. Declare
    # them explicitly so they survive `docker compose up` recreations (a bare
    # `docker network connect --alias` is lost on container recreation, which
    # caused the recurring "Failed to retrieve tables" in Studio).
    networks:
      default:
        aliases:
          - db
    healthcheck:
      test: pg_isready -U postgres -h localhost
      interval: 5s
      timeout: 5s
      retries: 10

  rest:
    image: postgrest/postgrest:v12.0.2
    container_name: churchos-rest
    # PostgREST calls getpwuid() on its runtime UID and the DB role's UID, but the
    # alpine image has no /etc/passwd entries for these. Bind-mount proper passwd/group
    # so the UID lookups succeed (errors: "could not look up local user ID 1000/0").
    user: "1000:1000"
    volumes:
      - ./passwd:/etc/passwd:ro
      - ./group:/etc/group:ro
    restart: unless-stopped
    ports:
      - "38080:3000"
    environment:
      # URL-encode the password (base64 contains / and = which break the URI).
      # POSTGRES_PASSWORD_ENCODED lives in docker/.env (gitignored).
      PGRST_DB_URI: "postgres://postgres:${POSTGRES_PASSWORD_ENCODED}@db:5432/postgres"
      PGRST_DB_SCHEMAS: public,storage
      PGRST_DB_ANON_ROLE: anon
      PGRST_JWT_SECRET: ${JWT_SECRET}
      PGRST_DB_USE_LEGACY_GUCS: "false"
    # Alias so Studio's SUPABASE_URL=http://rest:3000 resolves (see db comment)
    networks:
      default:
        aliases:
          - rest
    depends_on:
      db:
        condition: service_healthy

  # supabase/gotrue image serves the /auth/v1 API the app's Supabase client
  # calls (sign-in, /auth/v1/user session verification). The supabase/postgres
  # image already ships the auth schema + supabase_auth_admin role, so GoTrue
  # only needs DB credentials. HTTP is fine locally; TLS terminates upstream
  # in production.
  auth:
    image: supabase/gotrue:v2.196.0
    container_name: churchos-auth
    restart: unless-stopped
    ports:
      - "38081:9999"
    environment:
      GOTRUE_API_HOST: 0.0.0.0
      GOTRUE_API_PORT: 9999
      API_EXTERNAL_URL: http://localhost:38081
      GOTRUE_SITE_URL: http://localhost:3000
      # supabase_auth_admin is a NOLOGIN-by-default reserved role. This stack sets
      # its password to 'postgres' once via supabase_admin so GoTrue can connect.
      # Local dev only.
      DATABASE_URL: "postgres://supabase_auth_admin:postgres@db:5432/postgres"
      GOTRUE_DB_DRIVER: postgres
      # Legacy HS256 mode — MUST match the JWT_SECRET that anon/service API keys
      # are signed with and that PostgREST verifies (PGRST_JWT_SECRET). Do NOT
      # configure GOTRUE_JWT_KEYS (RS256) here: with RSA keys GoTrue rejects the
      # HS256-signed service key on every admin API call.
      GOTRUE_JWT_SECRET: ${JWT_SECRET}
      GOTRUE_JWT_EXP: 3600
      GOTRUE_JWT_DEFAULT_GROUP_NAME: authenticated
      GOTRUE_EXTERNAL_EMAIL_ENABLED: "true"
      GOTRUE_MAILER_AUTOCONFIRM: "true"
      GOTRUE_SMS_AUTOCONFIRM: "false"
      GOTRUE_SITE_INVITE_ONLY: "false"
      GOTRUE_DISABLE_SIGNUP: "false"
    depends_on:
      db:
        condition: service_healthy

  studio:
    # Pinned to the version upstream's docker/ compose ships and tests with
    # postgres-meta v0.96.6 ("latest" Aug 2026 build 500s on /pg-meta/query proxy)
    image: supabase/studio:2026.08.03-sha-022b374
    container_name: churchos-studio
    restart: unless-stopped
    ports:
      - "33001:3000"
    environment:
      SUPABASE_URL: http://rest:3000
      SUPABASE_ANON_KEY: ${ANON_KEY}
      # Required for studio to talk to db directly.
      # NOTE: studio interpolates POSTGRES_PASSWORD *unencoded* into
      # postgresql://user:PASS@host/db — a base64 password (/ and =) makes the
      # URL unparseable and pg-meta rejects it ("invalid url"), so we pass the
      # percent-encoded variant here. Only studio consumes it this way; db/rest
      # still use the raw value.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD_ENCODED}
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      POSTGRES_DB: postgres
      # Studio defaults these to supabase_read_only_user / supabase_admin,
      # which don't exist in a plain postgres db — override to postgres
      POSTGRES_USER_READ_WRITE: postgres
      POSTGRES_USER_READ_ONLY: postgres
      # Modern studio proxies ALL database-metadata queries (table editor,
      # schema viz, etc.) through the pg-meta service. Without this the
      # Table Editor fails with ERR_HTTP_INVALID_STATUS_CODE (500).
      STUDIO_PG_META_URL: http://meta:8080
      PG_META_CRYPTO_KEY: ${PG_META_CRYPTO_KEY}
    healthcheck:
      test: ["CMD", "node", "-e", "a=require('os').networkInterfaces(),ip=Object.values(a).flat().find(i=>i&&i.family==='IPv4'&&!i.internal)?.address;require('http').get('http://'+ip+':3000/project/default',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 5
    depends_on:
      db:
        condition: service_healthy
      rest:
        condition: service_started
      meta:
        condition: service_started

  meta:
    # Database-metadata API the studio's Table Editor depends on
    # (matches the official supabase/docker compose, pin supabase/postgres-meta)
    image: supabase/postgres-meta:v0.96.6
    container_name: churchos-meta
    restart: unless-stopped
    environment:
      PG_META_PORT: 8080
      PG_META_DB_HOST: db
      PG_META_DB_PORT: 5432
      PG_META_DB_NAME: postgres
      PG_META_DB_USER: postgres
      PG_META_DB_PASSWORD: ${POSTGRES_PASSWORD}
      CRYPTO_KEY: ${PG_META_CRYPTO_KEY}
    depends_on:
      db:
        condition: service_healthy

  nginx:
    image: nginx:alpine
    container_name: churchos-nginx
    restart: unless-stopped
    ports:
      - "8088:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - rest

volumes:
  db-data:
